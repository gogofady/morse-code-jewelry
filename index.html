// ════════════════════════════════════════════════════════════════

function t(key) { return T[state.lang][key] || key; }

function nav(page) {
  state.page = page;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleLang() {
  state.lang = state.lang === 'en' ? 'ar' : 'en';
  document.body.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  if (state.lang === 'ar') document.body.classList.add('font-arabic');
  else document.body.classList.remove('font-arabic');
  render();
}

function toMorse(text) {
  if (!text) return '';
  return text.toLowerCase().split('').map(c => MORSE_CODE[c] || c).join('  ');
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function setDraftMessage(val) {
  state.draftMessage = val.slice(0, 10);
  const el = document.getElementById('morse-preview');
  if (el) el.textContent = toMorse(state.draftMessage) || '· · · · ·';
  const inp = document.getElementById('custom-text-input');
  if (inp && inp.value !== state.draftMessage) inp.value = state.draftMessage;
}

function setDraftLength(val) {
  state.draftLength = val;
}

function addToCart(productId) {
  const customText = state.draftMessage.trim();
  if (!customText) { flashMessage(t('fill_fields'), 'error'); return; }
  const length = state.draftLength ? state.draftLength + '"' : 'Standard';
  state.cart.push({ productId, quantity: 1, customText, length });
  state.draftMessage = '';
  state.draftLength = '18';
  flashMessage(t('added_cart'), 'success');
  render();
}

function cartItems() {
  return state.cart.map((c, index) => {
    const p = state.products.find(x => x.id === c.productId);
    if (!p) return null;
    return { ...p, ...c, cartIndex: index, sub: p.price * c.quantity };
  }).filter(Boolean);
}

let flashTimer = null;
function flashMessage(msg, type = 'success', ms = 3200) {
  state.message = msg;
  state.messageType = type;
  render();
  if (flashTimer) clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { state.message = ''; render(); }, ms);
}

function viewProduct(id) {
  state.selectedProductId = Number(id);
  state.draftMessage = '';
  state.draftLength = '18';
  state.page = 'product_detail';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function submitOrder(evt) {
  evt.preventDefault();
  const f = evt.target;
  if (!/^\d{11}$/.test(f.phone1.value)) { flashMessage(t('phone_error'), 'error'); return; }

  const fullAddress = `Bldg ${f.building.value}, ${f.street.value}, ${f.district.value}, ${f.gov.value}, Floor ${f.floor.value}, Apt ${f.apt.value}`;
  const items = cartItems();
  const sub = items.reduce((s, it) => s + it.sub, 0);
  const ship = sub >= FREE_SHIPPING_THRESHOLD ? 0 : SHIPPING_COST;
  const total = sub + ship;

  const formattedItems = items.map(item => {
    let name = item.name;
    if (item.customText) name += ` [Msg: ${item.customText}]`;
    if (item.length && item.length !== 'Standard') name += ` [Len: ${item.length}]`;
    return { ...item, name };
  });

  const orderData = {
    name: f.name.value,
    phone1: f.phone1.value,
    phone2: f.phone2.value || '',
    address: fullAddress,
    items: formattedItems,
    totalPrice: total,
    shippingFee: ship,
    paymentMethod: 'COD',
    currency: 'EGP',
    lang: state.lang,
  };

  try {
    await addDoc(collection(db, 'orders'), { ...orderData, userId: currentUserId, timestamp: serverTimestamp() });
    if (GOOGLE_SCRIPT_URL) {
      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(orderData)
      }).catch(console.error);
    }
    state.cart = [];
    state.page = 'home';
    state.showSuccessModal = true;
    render();
  } catch (e) {
    console.error(e);
    flashMessage(t('order_failed'), 'error');
  }
}

async function submitContact(evt) {
  evt.preventDefault();
  const data = { name: evt.target.cname.value, phone: evt.target.cphone.value, message: evt.target.cmsg.value };
  await addDoc(collection(db, 'contact_messages'), { ...data, userId: currentUserId, timestamp: serverTimestamp() });
  evt.target.reset();
  flashMessage(t('send_msg') + ' ✓', 'success');
}

function renderToast() {
  if (!state.message) return '';
  const bg = state.messageType === 'success' ? 'var(--primary)' : '#991b1b';
  const icon = state.messageType === 'success' ? '✓' : '✕';
  return `<div class="toast" style="background:${bg};color:var(--cream);">${icon}&nbsp;&nbsp;${state.message}</div>`;
}

// ════════════════════════════════════════════════════════════════
//  MAIN RENDER
// ════════════════════════════════════════════════════════════════
const root = document.getElementById('root');

function render() {
  let pageContent = '';
  switch (state.page) {
    case 'home':           pageContent = renderHome(); break;
    case 'cart':           pageContent = renderCart(); break;
    case 'checkout':       pageContent = renderCheckout(); break;
    case 'product_detail': pageContent = renderProductDetail(); break;
    case 'gallery':        pageContent = renderGallery(); break;
    case 'contact':        pageContent = renderContact(); break;
    default:               pageContent = renderHome();
  }

  root.innerHTML = `
  <div class="flex flex-col min-h-screen">
    ${renderBanner()}
    ${renderNavbar()}
    <main class="flex-1 flex flex-col">${pageContent}</main>
    ${renderFooter()}
  </div>
  ${renderModals()}
  ${renderToast()}`;
}

// ════════════════════════════════════════════════════════════════
//  GLOBAL APP API
// ════════════════════════════════════════════════════════════════
window._app = {
  state, nav, toggleLang, viewProduct,
  addToCart, removeCartItem, clearCart,
  toMorse, setDraftMessage, setDraftLength,
  submitOrder, submitContact,
  togglePolicyModal: () => { state.showPolicyModal = !state.showPolicyModal; render(); },
  toggleSizeGuide:   () => { state.showSizeGuide   = !state.showSizeGuide;   render(); },
  closeSuccessModal: () => { state.showSuccessModal = false; render(); },
};

// Auth listener triggers first render
onAuthStateChanged(auth, user => {
  if (user) { currentUserId = user.uid; }
  else { signInAnonymously(auth).then(c => { currentUserId = c.user.uid; }).catch(console.error); }
  render();
});
